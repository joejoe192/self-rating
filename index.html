<div id="out" style="margin-top:1.5rem">
<p style="font-size:14px;color:var(--text-muted);margin:0">အားလုံး ၈ ခုကို အမှတ်ပေးပြီးမှ ရလဒ် ပေါ်ပါမယ်။</p>

</div>

<script>
(function(){
var rows=[].slice.call(document.querySelectorAll('.row'));
rows.forEach(function(r){
  r.querySelectorAll('.p').forEach(function(b){
    b.addEventListener('click',function(){
      r.querySelectorAll('.p').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      r.dataset.val=b.dataset.v;
      r.querySelector('.an').textContent=b.dataset.l;
      document.getElementById('err').textContent='';
    });
  });
});
document.getElementById('go').addEventListener('click',function(){
  var vals=rows.map(function(r){return {k:r.dataset.k,v:parseInt(r.dataset.val||0,10)}});
  if(vals.some(function(x){return !x.v})){
    document.getElementById('err').textContent='၈ ခုလုံး အမှတ်ပေးပါ';
    return;
  }
  var total=vals.reduce(function(a,b){return a+b.v},0);
  var band,eta;
  if(total<=15){band='အခြေခံ တည်ဆောက်ဆဲ';eta='၆-၉ လ';}
  else if(total<=23){band='သင်ယူဆဲ အဆင့်';eta='၄-၆ လ';}
  else if(total<=31){band='Interview နီးပြီ';eta='၂-၃ လ';}
  else {band='Entry level အသင့်';eta='အခုပဲ လျှောက်လို့ရ';}
  var sorted=vals.slice().sort(function(a,b){return a.v-b.v});
  var weak=sorted.slice(0,2).map(function(x){return x.k});
  var strong=sorted[sorted.length-1].k;
  var h='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">'
   +'<div class="mc"><div class="l">စုစုပေါင်း</div><div class="v">'+total+' / 40</div></div>'
   +'<div class="mc"><div class="l">အဆင့်</div><div class="v" style="font-size:18px">'+band+'</div></div>'
   +'<div class="mc"><div class="l">Interview အထိ ခန့်မှန်း</div><div class="v" style="font-size:18px">'+eta+'</div></div>'
   +'</div>'
   +'<div style="background:var(--bg-accent);border-radius:var(--radius);padding:1rem;margin-top:12px">'
   +'<p style="margin:0 0 6px;font-size:13px;color:var(--text-accent);font-weight:500">အရင်ဆုံး ဖြည့်ရမယ့် ၂ ခု</p>'
   +'<p style="margin:0;font-size:15px;color:var(--text-accent)">'+weak.join(' · ')+'</p></div>'
   +'<p style="font-size:14px;color:var(--text-secondary);margin:12px 0 0">အားသာချက်: '+strong+' — CV နဲ့ interview မှာ ဒါကို ရှေ့တန်းတင်ပါ။</p>'
   +'<div style="margin-top:1rem"><button id="ask">ဒီရလဒ်အတွက် ၃ လ roadmap ဆွဲပေးပါ ↗</button></div>';
  document.getElementById('out').innerHTML=h;
  document.getElementById('ask').addEventListener('click',function(){
    sendPrompt('Self-rating ရလဒ်: '+vals.map(function(x){return x.k+' '+x.v}).join(', ')+' (စုစုပေါင်း '+total+'/40)။ ဒီအခြေအနေအတွက် ၃ လ roadmap ဆွဲပေးပါ။');
  });
});
})();
</script>
